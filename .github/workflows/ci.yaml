name: Docker CI

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Build Docker container
      run: docker compose up spline-planner-dev --build -d
    
    - name: Check CPP code formatting
      run: docker exec spline-planner bash -c "
          find include -type f \( -name "*.cpp" -o -name "*.hpp" \) -exec clang-format --dry-run -Werror {} +
          find src -type f \( -name "*.cpp" -o -name "*.hpp" \) -exec clang-format --dry-run -Werror {} +
        "

    - name: Clean up container
      if: always()
      run: docker compose down